# ============================================================================
# WEDINVITER pSEO — Weekly Content Freshness Check
# ============================================================================
# Runs every Sunday at 06:00 UTC to identify stale content (>90 days old).
# Stale pages with quality_score < 80 are re-queued for regeneration.
# Pages >180 days old are always re-queued regardless of score.
# ============================================================================

name: pSEO Freshness Check

on:
  schedule:
    # Every Sunday at 06:00 UTC (10:00 Dubai)
    - cron: "0 6 * * 0"

  # Manual trigger
  workflow_dispatch:

jobs:
  freshness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check and Re-queue Stale Pages
        run: npx tsx scripts/pseo/check-freshness.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Log Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            const date = now.split('T')[0];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 pSEO Freshness Check — ${date}`,
              body: `Weekly freshness check completed.\n\n` +
                    `Workflow: ${runUrl}\n` +
                    `Check time: ${now}\n\n` +
                    `See workflow logs for details on stale pages identified and re-queued.`,
              labels: ['pseo-alert', 'maintenance']
            });
